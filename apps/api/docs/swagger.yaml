basePath: /
definitions:
  dto.BuildCreateRequest:
    properties:
      components:
        items:
          type: integer
        type: array
      creator_user_id:
        type: integer
      name:
        type: string
      tags:
        items:
          type: string
        type: array
    required:
    - components
    - creator_user_id
    - name
    type: object
  dto.BuildResponse:
    properties:
      components:
        items:
          type: integer
        type: array
      created_at:
        type: string
      creator_user_id:
        type: integer
      id:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      template_id:
        type: string
      updated_at:
        type: string
      vote_score:
        type: integer
    type: object
  dto.PrivateProfileResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  dto.PublicProfileResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  dto.TemplateCreateRequest:
    properties:
      component_pool:
        items:
          type: integer
        type: array
      creator_user_id:
        type: integer
      name:
        type: string
      rules:
        items:
          type: integer
        type: array
    required:
    - component_pool
    - creator_user_id
    - name
    - rules
    type: object
  dto.TemplateResponse:
    properties:
      component_pool:
        items:
          type: integer
        type: array
      created_at:
        type: string
      creator_user_id:
        type: integer
      id:
        type: string
      name:
        type: string
      rules:
        items:
          type: integer
        type: array
      updated_at:
        type: string
    type: object
  dto.UserRegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 50
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 4
        type: string
    required:
    - email
    - password
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Respawn Build Maker application
  title: Respawn Build Maker API
  version: "1.0"
paths:
  /templates:
    get:
      consumes:
      - application/json
      description: List templates created by a user with pagination
      parameters:
      - description: Creator user ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TemplateResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List templates by user
      tags:
      - templates
    post:
      consumes:
      - application/json
      description: Creates a new template with a component pool and rules
      parameters:
      - description: Template creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TemplateCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TemplateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new template
      tags:
      - templates
  /templates/{id}:
    get:
      consumes:
      - application/json
      description: Returns a single template by identifier
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TemplateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a template by ID
      tags:
      - templates
  /templates/{template_id}/builds:
    get:
      consumes:
      - application/json
      description: List builds associated with a template
      parameters:
      - description: Template ID
        in: path
        name: template_id
        required: true
        type: string
      - description: Creator user ID
        in: query
        name: user_id
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BuildResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List builds by template
      tags:
      - builds
    post:
      consumes:
      - application/json
      description: Creates a build from a template
      parameters:
      - description: Template ID
        in: path
        name: template_id
        required: true
        type: string
      - description: Build creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BuildCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BuildResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new build
      tags:
      - builds
  /templates/{template_id}/builds/{build_id}:
    get:
      consumes:
      - application/json
      description: Returns a single build by identifier
      parameters:
      - description: Template ID
        in: path
        name: template_id
        required: true
        type: string
      - description: Build ID
        in: path
        name: build_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BuildResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a build by ID
      tags:
      - builds
  /users:
    get:
      consumes:
      - application/json
      description: Get a single user by username or ID, or list all users with pagination
      parameters:
      - description: Username to search for
        in: query
        name: username
        type: string
      - description: User ID to search for
        in: query
        name: id
        type: integer
      - description: 'Number of results per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of results to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users with pagination
          schema:
            items:
              $ref: '#/definitions/dto.PublicProfileResponse'
            type: array
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user(s) by query parameters
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Registers a new user with username, email, and password
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PrivateProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes a user by ID (requires authentication)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'message: User deleted successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
